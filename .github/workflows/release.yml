name: 建置待審核 Windows 發行版

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows-build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest

    steps:
      - name: 取得原始碼
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: 設定 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: 核對標籤與程式版本
        shell: pwsh
        run: python tools/check_release_version.py $env:GITHUB_REF_NAME

      - name: 安裝固定依賴
        run: python -m pip install -r requirements-lock.txt

      - name: 測試、打包並驗證執行檔
        shell: pwsh
        run: .\build_release.ps1

      - name: 保留已驗證的發布產物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quota-dock-release
          path: |
            release/QuotaDock-Windows-x64.exe
            release/QuotaDock-Licenses.zip
            release/QuotaDock-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: windows-build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: 取得已驗證的發布產物
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: quota-dock-release
          path: release

      - name: 建立或更新待審核發行草稿
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = @(
            'release\QuotaDock-Windows-x64.exe',
            'release\QuotaDock-Licenses.zip',
            'release\QuotaDock-SHA256SUMS.txt'
          )
          $ErrorActionPreference = 'SilentlyContinue'
          $draftStatus = gh release view $tag --json isDraft --jq .isDraft 2>$null
          $releaseExists = $LASTEXITCODE -eq 0
          $ErrorActionPreference = 'Stop'
          if ($releaseExists) {
            if ("$draftStatus".Trim() -ne 'true') {
              throw "發布標籤 $tag 已有公開 Release，不可覆寫正式版附件。"
            }
            gh release upload $tag $assets --clobber
          } else {
            gh release create $tag $assets --draft --verify-tag --notes '此版本已完成自動化測試、Windows 打包與展示啟動檢查。請依儲存庫內的驗證紀錄及變更內容完成審核後再正式發布。' --title "QuotaDock $tag"
          }
          if ($LASTEXITCODE -ne 0) {
            throw "發布 $tag 失敗。"
          }
